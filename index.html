<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P-Klap</title>
      <link rel="stylesheet" href="css/style.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <div id="game-stage">
      <canvas id="game-canvas" tabindex="0" aria-label="P-Klap game canvas"></canvas>
      <img id="logo" src="assets/logo.jpg" alt="RSI BlackBox">
      <div id="initials-overlay" hidden>
        <p id="initials-title">Top 10!</p>
        <p id="initials-hint">Enter 2 initials</p>
        <input id="initials-input" type="text" maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Two initials">
        <button type="button" id="initials-skip">Skip</button>
      </div>
    </div>
  </div>
  <script src="js/game.js?v=7"></script>
</body>
</html>
